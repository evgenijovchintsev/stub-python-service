version: "3.9"

services:
  app:
    build: .
    container_name: stub-python-service
    depends_on:
      - postgres
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://user:password@postgres:5432/db
      DEBUG: "true"
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    container_name: stub-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
