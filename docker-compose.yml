version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://user:password@postgres:5432/db
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: