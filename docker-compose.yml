services:
  app:
    build: .
    container_name: stub-python-service
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://user:password@db:5432/db
      JWT_SECRET: change-me-before-production
      JWT_EXPIRE_MINUTES: 60
      DEBUG: true
    depends_on:
      - db
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  db:
    image: postgres:16-alpine
    container_name: stub-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
