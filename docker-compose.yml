version: "3.9"

services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://user:password@db:5432/db
      JWT_SECRET: change-me-before-production
      JWT_EXPIRE_MINUTES: 60
      DEBUG: true
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"

volumes:
  pg_data:"