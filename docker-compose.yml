version: "3.9"

services:
  app:
    build: .
    container_name: stub-python-service
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://user:password@db:5432/db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: stub-postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db

volumes:
  pgdata: