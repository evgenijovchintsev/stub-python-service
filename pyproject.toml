[tool.poetry]
name = "stub-python-service"
version = "0.1.0"
edition = "2021"
description = "Python Service for testing MergeCrafted agentic system"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ^3.10
fastapi = "^0.110.0"
uicorn = "^0.29.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
alembic = "^1.13.2"
pydantic = "^2.7.4"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.dev-dependencies]
pytest = "^8.3.2"
fastapi-testclient = "^0.1.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
builder = "poetry.core.masonry.api"
