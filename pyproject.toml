[tool.poetry]
name = "stub-python-service"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2021"

[tool.poetry.dependencies]
python = ^"3.11"
fastapi = "^0.109.2"
uicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.7.4"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.dev-dependencies]
pytest = "^8.3.2"
fastapi-testclient = "^0.0.1"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"
